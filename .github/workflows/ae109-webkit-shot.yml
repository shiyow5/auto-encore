name: ae109-webkit-shot

# AE#109 の確認用（一時）: 共有ホストに apt を入れず、CI の Playwright WebKit で
# https://shiyow5.github.io/auto-encore/ を撮影する。main には入れない。
on:
  push:
    branches: [nodoka/ae109-webkit-shot]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit-shot:
    name: webkit-shot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Verify main HEAD equals target SHA before capture
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 638cec16216ad08131869a496769c29f9600cc05
        run: |
          HEAD_SHA=$(gh api repos/${{ github.repository }}/commits/main --jq .sha)
          echo "main HEAD: $HEAD_SHA target: $TARGET_SHA"
          if [ "$HEAD_SHA" != "$TARGET_SHA" ]; then echo "SHA mismatch: stop"; exit 1; fi
      - name: Install Playwright WebKit (outside repo)
        run: |
          mkdir -p "$RUNNER_TEMP/shot" && cd "$RUNNER_TEMP/shot"
          npm init -y >/dev/null
          npm i playwright@1.65.0
          npx playwright install --with-deps webkit
      - name: Capture
        env:
          TARGET_URL: https://shiyow5.github.io/auto-encore/
          OUT_DIR: ${{ runner.temp }}/ae109-out
          TARGET_SHA: 638cec16216ad08131869a496769c29f9600cc05
        run: |
          cd "$RUNNER_TEMP/shot"
          cat > shot.mjs <<'JS'
          import { webkit } from 'playwright';
          import fs from 'node:fs';
          const out = process.env.OUT_DIR;
          fs.mkdirSync(out, { recursive: true });
          const log = [];
          const note = (s) => { log.push(s); console.log(s); };
          const browser = await webkit.launch();
          note(`webkit version: ${browser.version()}`);
          note(`target sha: ${process.env.TARGET_SHA}`);
          note(`started (UTC): ${new Date().toISOString()}`);
          const page = await browser.newPage({ viewport: { width: 1280, height: 720 } });
          const errors = [];
          page.on('pageerror', (e) => errors.push(String(e)));
          try {
            await page.goto(process.env.TARGET_URL, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(3000);
            await page.screenshot({ path: `${out}/01-top.png` });
            note('01-top.png saved');
            await page.getByLabel('はじめる').click({ timeout: 30000 });
            note('clicked: はじめる');
            await page.waitForTimeout(500);
            await page.locator('[data-order-id="order-01"] button').click({ timeout: 30000 });
            note('clicked: order-01');
            await page.waitForTimeout(6000);
            const visible = await page.locator('#ws-overlay').isVisible();
            note(`#ws-overlay visible: ${visible}`);
            await page.screenshot({ path: `${out}/02-workshop-6s.png` });
            note('02-workshop-6s.png saved');
            const white = await page.evaluate(() => {
              const o = document.getElementById('ws-overlay');
              if (!o) return [];
              const r = [];
              o.querySelectorAll('*').forEach((el) => {
                const bg = getComputedStyle(el).backgroundColor;
                if (bg === 'rgb(255, 255, 255)' || bg === 'rgba(255, 255, 255, 1)') {
                  const b = el.getBoundingClientRect();
                  r.push(`${el.tagName} ${el.className} @${Math.round(b.x)},${Math.round(b.y)} ${Math.round(b.width)}x${Math.round(b.height)}`);
                }
              });
              return r;
            });
            note(`pure-white background elements in #ws-overlay: ${white.length}`);
            white.forEach((w) => note('  ' + w));
          } catch (e) {
            note(`ERROR: ${e.message.split('\n')[0]}`);
            await page.screenshot({ path: `${out}/99-error.png` }).catch(() => {});
          }
          note(`pageerror count: ${errors.length}`);
          note(`finished (UTC): ${new Date().toISOString()}`);
          fs.writeFileSync(`${out}/info.txt`, log.join('\n') + '\n');
          await browser.close();
          JS
          node shot.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ae109-webkit-shot
          path: ${{ runner.temp }}/ae109-out/
          retention-days: 14
