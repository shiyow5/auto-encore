<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Encore ― 夜更けのオルゴール工房</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1e1722;
      }
      #game {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        image-rendering: pixelated;
      }
      /* #124: Chromium の合成で、WebGL canvas の上に不透明な DOM（例: チュートリアル帯）があると、
         その上下反転の位置で canvas が描かれず穴になる（透明。スクショやビューアでは白く見える）。
         filter で canvas を別の描画面にして避ける。見た目は変わらない */
      #game > canvas {
        filter: opacity(1);
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
